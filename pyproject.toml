[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "members-cli"
version = "0.1.0"
description = "Command-line tool for listing, searching, summarizing and exporting member records from a CSV file."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Charles Burke" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
members = "members_cli.cli:main"

[project.urls]
Homepage = "https://github.com/chasburke/my_awesome_project"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
